# ============================================
# TradingBot "Крон" — Docker Compose (P4)
#
# Поднимаем PostgreSQL + pgAdmin для мониторинга
# MT5 Connector запускается на хосте (не в контейнере)
# ============================================

version: '3.8'

services:
  # === PostgreSQL 16 ===
  postgres:
    image: postgres:16-alpine
    container_name: krons-trading-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-3981545b}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - krons-net

  # === pgAdmin (опционально, для мониторинга) ===
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: krons-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kronstrading.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - krons-net

  # === TradingBot (опционально, если запускать вне Windows) ===
  tradingbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krons-trading-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Примечание: MT5 Python пакет работает только на Windows!
    # Этот сервис для Linux-серверов с криптоаналитикой (gemini fallback)
    networks:
      - krons-net

volumes:
  pgdata:
    driver: local

networks:
  krons-net:
    driver: bridge
