[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/app/logs

[program:xvfb]
command=Xvfb :99 -screen 0 1024x768x16
autostart=true
autorestart=true
priority=10
stdout_logfile=/app/logs/xvfb.log
stderr_logfile=/app/logs/xvfb_err.log

[program:mt5-terminal]
command=/opt/mt5/mt5_startup.sh
autostart=true
autorestart=true
startretries=5
startsecs=20
priority=20
environment=DISPLAY=":99",WINEDEBUG="-all"
stdout_logfile=/app/logs/mt5_terminal.log
stderr_logfile=/app/logs/mt5_terminal_err.log

[program:tradingbot]
command=python3 -m main --bot
autostart=true
autorestart=true
startretries=3
startsecs=30
priority=30
directory=/app
stdout_logfile=/app/logs/tradingbot.log
stderr_logfile=/app/logs/tradingbot_err.log
