[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=2MB
logfile_backups=1
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1024x768x16
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:mt5-terminal]
command=/opt/mt5/mt5_startup.sh
autostart=true
autorestart=true
startretries=5
startsecs=20
priority=20
environment=DISPLAY=":99",WINEDEBUG="-all"
stdout_logfile=/app/logs/mt5_terminal.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/app/logs/mt5_terminal_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:tradingbot]
command=python3 -m main --bot
autostart=true
autorestart=true
startretries=3
startsecs=30
priority=30
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
