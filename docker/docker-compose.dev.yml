# ============================================
# Docker Compose — DEV override (только БД)
# Использование: docker compose -f docker-compose.yml -f docker/docker-compose.dev.yml up
# ============================================

services:
  mt5-bot:
    profiles:
      - disabled  # не запускаем MT5 бота в dev-режиме

  postgres:
    ports:
      - "5432:5432"

  pgadmin:
    profiles: []  # включаем pgadmin в dev
