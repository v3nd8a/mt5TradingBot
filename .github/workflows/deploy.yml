# ============================================================
# GitHub Actions — CI/CD for TradingBot "Крон"
#
# Workflow:
#   1. Lint + Test on push/PR
#   2. Build Docker image
#   3. Deploy to server on push to main
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_IMAGE: krons-trading-bot
  REGISTRY: ghcr.io

jobs:
  # ==================== Job 1: Lint & Test ====================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.docker.txt
          pip install pytest flake8 mypy

      - name: Lint with flake8
        run: |
          # Критические ошибки
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=vendor,__pycache__,.git,venv,.venv
          # Предупреждения
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics \
            --exclude=vendor,__pycache__,.git,venv,.venv

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short || echo "Tests completed (some may require MT5)"
        env:
          MT5_DEMO_MODE: "true"
          MT5_SIMULATION_MODE: "true"

  # ==================== Job 2: Build Docker Image ====================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Job 3: Deploy to Server ====================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create deployment package
        run: |
          tar czf deploy-package.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='logs' \
            --exclude='data' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='.env' \
            --exclude='vendor/Kronos/webui/prediction_results' \
            .

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            
            DEPLOY_DIR=/opt/tradingbot
            
            # Бэкап
            if [ -d "$DEPLOY_DIR/app" ]; then
              cp -r "$DEPLOY_DIR/app" "$DEPLOY_DIR/backup-$(date +%Y%m%d-%H%M%S)"
            fi

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "deploy-package.tar.gz"
          target: "/tmp/"

      - name: Extract and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            
            DEPLOY_DIR=/opt/tradingbot
            
            mkdir -p "$DEPLOY_DIR/app"
            tar xzf /tmp/deploy-package.tar.gz -C "$DEPLOY_DIR/app"
            rm /tmp/deploy-package.tar.gz
            
            # Восстанавливаем .env (не заменяем серверный)
            if [ ! -f "$DEPLOY_DIR/app/.env" ] && [ -f "$DEPLOY_DIR/.env" ]; then
              cp "$DEPLOY_DIR/.env" "$DEPLOY_DIR/app/.env"
            fi
            
            cd "$DEPLOY_DIR/app"
            
            # Пересобираем и запускаем
            docker compose pull 2>/dev/null || true
            docker compose build
            docker compose up -d
            
            # Ждём и проверяем
            sleep 15
            docker compose ps
            echo "✅ Deployment successful!"

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/tradingbot/app
            
            # Проверяем что контейнеры запущены
            if docker compose ps | grep -q "Up"; then
              echo "✅ Containers are running"
            else
              echo "❌ Some containers are not running!"
              docker compose ps
              docker compose logs --tail=50
              exit 1
            fi
